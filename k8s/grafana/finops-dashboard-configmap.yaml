apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-finops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  finops-dashboard.json: |
    {
      "id": null,
      "uid": "finops-cost-intel",
      "title": "💰 Overwatch — FinOps Cost Intelligence",
      "description": "EC2 resource utilization and cost prediction — Overwatch",
      "tags": ["finops", "cost", "aws", "ec2"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "📊 Current Resource Utilization",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU Utilization (24h avg)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              },
              "mappings": []
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "area" },
          "targets": [
            {
              "expr": "finops:cpu_utilization_24h",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "RAM Utilization (24h avg)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [
            {
              "expr": "finops:ram_utilization_24h",
              "legendFormat": "RAM %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Disk Utilization",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [
            {
              "expr": "finops:disk_utilization",
              "legendFormat": "Disk %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Total RAM",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "GB",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            {
              "expr": "finops:total_ram_gb",
              "legendFormat": "RAM GB",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "📈 Resource Trends (Last 7 Days)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage Trend",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU Usage %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "RAM Usage Trend",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "RAM Usage %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "🔮 Capacity Forecasting (Next 14 Days)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "RAM Forecast — Will it run out?",
          "description": "Uses predict_linear() to forecast RAM usage for next 14 days based on 7 day trend",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "Actual RAM %",
              "refId": "A"
            },
            {
              "expr": "(1 - ((node_memory_MemAvailable_bytes + predict_linear(node_memory_MemAvailable_bytes[7d], 14*24*3600)) / node_memory_MemTotal_bytes / 2)) * 100",
              "legendFormat": "Predicted RAM % (14d)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Disk Forecast — When will it fill up?",
          "description": "Uses predict_linear() to forecast disk usage for next 14 days based on 7 day trend",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "finops:disk_utilization",
              "legendFormat": "Actual Disk %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "row",
          "title": "💰 EC2 Instance Cost Comparison",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "collapsed": false
        },
        {
          "id": 13,
          "type": "table",
          "title": "EC2 Instance Pricing vs Your Usage (us-west-2, On-Demand, Linux)",
          "description": "Compare your actual resource usage against EC2 instance types to find the most cost-effective option",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Monthly Cost" },
                "properties": [{ "id": "unit", "value": "currencyUSD" }]
              },
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-background"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "✅ Recommended": { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "⚠️ Current": { "color": "blue", "index": 1 } } },
                      { "type": "value", "options": { "❌ Too Small": { "color": "red", "index": 2 } } }
                    ]
                  }
                ]
              }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } },
          "targets": [
            {
              "expr": "vector(8.47)",
              "legendFormat": "t2.micro | 1 vCPU | 1 GB RAM | $8.47/mo",
              "refId": "A",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            }
          ],
          "plugin": "table"
        },
        {
          "id": 14,
          "type": "stat",
          "title": "💡 Cost Saving Tip",
          "description": "If 7-day avg CPU < 20% and RAM < 40% → downgrade instance",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 34 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 80 }
                ]
              },
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 20,
                    "result": { "text": "💚 Under-utilized — Consider downgrading instance to save cost", "color": "green" }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 20,
                    "to": 75,
                    "result": { "text": "✅ Well utilized — Current instance is right-sized", "color": "blue" }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 75,
                    "to": 100,
                    "result": { "text": "🔴 Over-utilized — Consider upgrading instance to avoid performance issues", "color": "red" }
                  }
                }
              ]
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "value" },
          "targets": [
            {
              "expr": "finops:cpu_utilization_24h",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ]
        }
      ]
    }
