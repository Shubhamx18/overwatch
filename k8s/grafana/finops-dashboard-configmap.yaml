apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-finops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  finops-dashboard.json: |
    {
      "id": null,
      "uid": "finops-cost-intel",
      "title": "Overwatch - FinOps Cost Intelligence",
      "description": "Real resource utilization and AWS cost visibility",
      "tags": ["finops", "cost", "aws"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "5m",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [

        {
          "id": 1,
          "type": "row",
          "title": "Resource Utilization — What You Are Actually Using",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },

        {
          "id": 2,
          "type": "gauge",
          "title": "CPU Usage",
          "description": "Real-time CPU utilization across all nodes",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "showThresholdLabels": true,
            "showThresholdMarkers": true
          },
          "targets": [{
            "expr": "finops:cpu_utilization_24h",
            "legendFormat": "CPU %",
            "refId": "A"
          }]
        },

        {
          "id": 3,
          "type": "gauge",
          "title": "RAM Usage",
          "description": "Real-time RAM utilization across all nodes",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "showThresholdLabels": true,
            "showThresholdMarkers": true
          },
          "targets": [{
            "expr": "finops:ram_utilization_24h",
            "legendFormat": "RAM %",
            "refId": "A"
          }]
        },

        {
          "id": 4,
          "type": "gauge",
          "title": "Disk Usage",
          "description": "Real-time disk utilization",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "showThresholdLabels": true,
            "showThresholdMarkers": true
          },
          "targets": [{
            "expr": "finops:disk_utilization",
            "legendFormat": "Disk %",
            "refId": "A"
          }]
        },

        {
          "id": 5,
          "type": "row",
          "title": "Cost Breakdown — Based on Actual Usage",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false
        },

        {
          "id": 6,
          "type": "stat",
          "title": "Instance Type",
          "description": "ap-south-1 (Mumbai) | On-Demand | Linux",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0.0416": { "text": "t3.medium" } } }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "name", "graphMode": "none" },
          "targets": [{ "expr": "finops:ec2_hourly_cost_usd", "legendFormat": "t3.medium | 2vCPU | 4GB | ap-south-1", "refId": "A" }]
        },

        {
          "id": 7,
          "type": "stat",
          "title": "Hourly Rate",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "auto" },
          "targets": [{ "expr": "finops:ec2_hourly_cost_usd", "legendFormat": "Per Hour", "refId": "A" }]
        },

        {
          "id": 8,
          "type": "stat",
          "title": "Cost This Session",
          "description": "Total cost since EC2 was started",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "auto" },
          "targets": [{ "expr": "finops:ec2_session_cost_usd", "legendFormat": "Session $", "refId": "A" }]
        },

        {
          "id": 9,
          "type": "stat",
          "title": "Daily Projected",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "auto" },
          "targets": [{ "expr": "finops:ec2_daily_cost_usd", "legendFormat": "Per Day", "refId": "A" }]
        },

        {
          "id": 10,
          "type": "stat",
          "title": "Monthly Projected",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 25 },
                  { "color": "red", "value": 50 }
                ]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "auto" },
          "targets": [{ "expr": "finops:ec2_monthly_cost_usd", "legendFormat": "Per Month", "refId": "A" }]
        },

        {
          "id": 11,
          "type": "stat",
          "title": "Effective Cost (What You Use)",
          "description": "Cost of resources you actually consume: hourly_rate x avg_utilization",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "auto" },
          "targets": [{
            "expr": "0.0416 * ((finops:cpu_utilization_24h / 100 * 0.5) + (finops:ram_utilization_24h / 100 * 0.5))",
            "legendFormat": "Effective $/hr",
            "refId": "A"
          }]
        },

        {
          "id": 12,
          "type": "row",
          "title": "Cost vs Waste — Are You Right-Sized?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },

        {
          "id": 13,
          "type": "bargauge",
          "title": "Cost Efficiency — Used vs Wasted",
          "description": "Green = money you get value from. Red = money wasted on idle resources.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.02 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "targets": [
            {
              "expr": "0.0416 * ((finops:cpu_utilization_24h / 100 * 0.5) + (finops:ram_utilization_24h / 100 * 0.5))",
              "legendFormat": "Cost Used (Value)",
              "refId": "A"
            },
            {
              "expr": "0.0416 * (1 - ((finops:cpu_utilization_24h / 100 * 0.5) + (finops:ram_utilization_24h / 100 * 0.5)))",
              "legendFormat": "Cost Wasted (Idle)",
              "refId": "B"
            }
          ]
        },

        {
          "id": 14,
          "type": "bargauge",
          "title": "Resource Utilization vs Capacity",
          "description": "How much of your t3.medium (2vCPU 4GB) you are actually using",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "targets": [
            { "expr": "finops:cpu_utilization_24h", "legendFormat": "CPU Used %", "refId": "A" },
            { "expr": "finops:ram_utilization_24h", "legendFormat": "RAM Used %", "refId": "B" },
            { "expr": "finops:disk_utilization", "legendFormat": "Disk Used %", "refId": "C" }
          ]
        },

        {
          "id": 15,
          "type": "row",
          "title": "Trends",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "collapsed": false
        },

        {
          "id": 16,
          "type": "timeseries",
          "title": "CPU and RAM Usage Over Time",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU %",
              "refId": "A"
            },
            {
              "expr": "avg(100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100))",
              "legendFormat": "RAM %",
              "refId": "B"
            }
          ]
        },

        {
          "id": 17,
          "type": "timeseries",
          "title": "Cumulative Cost This Session ($)",
          "description": "Running dollar cost since EC2 started",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 3,
              "color": { "mode": "fixed", "fixedColor": "green" },
              "custom": { "lineWidth": 2, "fillOpacity": 20 }
            }
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [{
            "expr": "finops:ec2_session_cost_usd",
            "legendFormat": "Total Cost $",
            "refId": "A"
          }]
        },

        {
          "id": 18,
          "type": "row",
          "title": "Right-Sizing Recommendation",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "collapsed": false
        },

        {
          "id": 19,
          "type": "stat",
          "title": "Right-Sizing Advice",
          "description": "Based on current CPU utilization",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 33 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0, "to": 15,
                    "result": { "text": "UNDER-UTILIZED: CPU below 15% — Consider downgrading to t3.small ($15/mo) and save ~$15/month", "color": "orange" }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 15, "to": 70,
                    "result": { "text": "RIGHT-SIZED: Usage is healthy — t3.medium ($30/mo) is the correct choice for your workload", "color": "green" }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 70, "to": 100,
                    "result": { "text": "OVER-UTILIZED: CPU above 70% — Consider upgrading to t3.large ($60/mo) to avoid performance issues", "color": "red" }
                  }
                }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "textMode": "value", "graphMode": "none" },
          "targets": [{ "expr": "finops:cpu_utilization_24h", "legendFormat": "", "refId": "A" }]
        }

      ]
    }
