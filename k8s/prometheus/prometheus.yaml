apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'kind-monitoring-cluster'
        env: 'dev'

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alertrules.yml

    scrape_configs:

      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Node Exporter - Host metrics
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: 'node-exporter'
            action: keep

      # kube-state-metrics - K8s object metrics
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes Nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # cAdvisor - Container metrics from kubelet
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes Pods - auto-discover all pods with annotation
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Blackbox Exporter - URL uptime monitoring
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://google.com
              - https://github.com
              - http://grafana:3000
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # Blackbox Exporter - SSL Certificate check
      - job_name: 'blackbox-ssl'
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
              - google.com:443
              - github.com:443
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

  alertrules.yml: |
    groups:

    # ─── Node Alerts ───────────────────────────────────────────
    - name: NodeAlerts
      rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is DOWN"
          description: "Node Exporter on {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}% on {{ $labels.instance }}."

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_free_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Disk Usage on {{ $labels.instance }}"
          description: "Disk usage is {{ $value | humanize }}% on {{ $labels.instance }} mount {{ $labels.mountpoint }}."

      - alert: DiskWillFillIn4Hours
        expr: predict_linear(node_filesystem_free_bytes{fstype!="tmpfs"}[6h], 4*3600) < 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Disk will fill up in 4 hours on {{ $labels.instance }}"
          description: "At the current write rate, disk on {{ $labels.instance }} will be full in less than 4 hours."

      - alert: DiskWillFillIn24Hours
        expr: predict_linear(node_filesystem_free_bytes{fstype!="tmpfs"}[6h], 24*3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk will fill up in 24 hours on {{ $labels.instance }}"
          description: "At the current write rate, disk on {{ $labels.instance }} will be full within 24 hours."

    # ─── Kubernetes Pod Alerts ─────────────────────────────────
    - name: KubernetesPodAlerts
      rules:
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value | humanize }} times in the last 15 minutes."

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is NOT ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in a non-ready state for more than 5 minutes."

      - alert: PodOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was killed due to Out Of Memory."

    # ─── Kubernetes Deployment Alerts ──────────────────────────
    - name: KubernetesDeploymentAlerts
      rules:
      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_available_replicas
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has {{ $value }} unavailable replicas."

      - alert: DeploymentRolloutStuck
        expr: kube_deployment_status_observed_generation{namespace!="kube-system"} != kube_deployment_metadata_generation{namespace!="kube-system"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout is stuck"
          description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has a stuck rollout."

    # ─── Blackbox / Uptime Alerts ──────────────────────────────
    - name: UptimeAlerts
      rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is DOWN"
          description: "Blackbox probe failed for {{ $labels.instance }} for more than 1 minute."

      - alert: SlowResponse
        expr: probe_duration_seconds > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow response from {{ $labels.instance }}"
          description: "{{ $labels.instance }} is taking {{ $value | humanize }}s to respond."

      - alert: SSLCertExpiringIn7Days
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SSL Certificate for {{ $labels.instance }} expires in less than 7 days"
          description: "SSL certificate for {{ $labels.instance }} will expire soon. Renew immediately."

      - alert: SSLCertExpiringIn30Days
        expr: probe_ssl_earliest_cert_expiry - time() < 30 * 24 * 3600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SSL Certificate for {{ $labels.instance }} expires in less than 30 days"
          description: "SSL certificate for {{ $labels.instance }} will expire within 30 days."

    # ─── Alertmanager Itself ───────────────────────────────────
    - name: AlertmanagerAlerts
      rules:
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is DOWN"
          description: "Alertmanager has been unreachable for more than 1 minute. Alerts will NOT be delivered."

    # ─── FinOps — Cost Intelligence Alerts ────────────────────
    - name: FinOpsAlerts
      rules:
      # CPU under-utilized for 7 days → downgrade instance
      - alert: InstanceOverProvisioned
        expr: (1 - avg_over_time(rate(node_cpu_seconds_total{mode="idle"}[5m])[7d:5m])) * 100 < 10
        for: 1d
        labels:
          severity: info
        annotations:
          summary: "EC2 instance may be over-provisioned"
          description: "Average CPU usage over 7 days is below 10%. Consider downgrading instance type to save costs."

      # RAM growing fast → will need bigger instance soon
      - alert: MemoryGrowthDetected
        expr: predict_linear(node_memory_MemAvailable_bytes[7d], 14*24*3600) < node_memory_MemTotal_bytes * 0.1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Memory growing fast — may need larger instance in 14 days"
          description: "At current memory growth rate, available memory will drop below 10% in 14 days. Consider upgrading EC2 instance type."

      # Disk growing fast → will need more storage soon
      - alert: DiskGrowthDetected
        expr: predict_linear(node_filesystem_free_bytes{mountpoint="/"}[7d], 14*24*3600) < node_filesystem_size_bytes{mountpoint="/"} * 0.1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk growing fast — may run out of space in 14 days"
          description: "At current disk growth rate, free space will drop below 10% in 14 days. Consider increasing EBS volume size."

    # ─── FinOps — Recording Rules (pre-computed metrics) ───────
    - name: FinOpsRecording
      interval: 5m
      rules:
      # CPU utilization % — single value across all CPUs and nodes
      - record: finops:cpu_utilization_24h
        expr: 100 - (avg(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      # RAM utilization % — single value across all nodes
      - record: finops:ram_utilization_24h
        expr: avg(100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100))

      # Disk utilization % — single value (highest used disk)
      - record: finops:disk_utilization
        expr: max(100 - (node_filesystem_free_bytes{fstype!="tmpfs",fstype!="overlay"} / node_filesystem_size_bytes{fstype!="tmpfs",fstype!="overlay"} * 100))

      # Total RAM in GB — sum across all nodes
      - record: finops:total_ram_gb
        expr: sum(node_memory_MemTotal_bytes) / 1073741824

      # Total Disk in GB — sum across all nodes
      - record: finops:total_disk_gb
        expr: sum(node_filesystem_size_bytes{fstype!="tmpfs",fstype!="overlay"}) / 1073741824

      # ── AWS Cost Estimation (t3.medium ap-south-1 on-demand) ───
      # Hourly rate in USD
      - record: finops:ec2_hourly_cost_usd
        expr: vector(0.0416)

      # Cost since EC2 last boot (session cost)
      - record: finops:ec2_session_cost_usd
        expr: 0.0416 * ((time() - min(node_boot_time_seconds)) / 3600)

      # Projected daily cost
      - record: finops:ec2_daily_cost_usd
        expr: vector(0.0416 * 24)

      # Projected monthly cost (730 hours = 1 month)
      - record: finops:ec2_monthly_cost_usd
        expr: vector(0.0416 * 730)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.enable-lifecycle'
            - '--web.enable-admin-api'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: web
  selector:
    app: prometheus
