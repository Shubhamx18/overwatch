---
# Fix for 403 Forbidden on kubernetes-nodes and kubernetes-cadvisor in Kind
# Grants Prometheus permission to access kubelet metrics directly
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kubelet-api-admin
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
