name: CI/CD - Overwatch Observability Stack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Job 1: Validate K8s YAML ──────────────────────────────────
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate K8s YAML with kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  # ─── Job 2: Integration Test ────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          config: k8s/kind/kind-cluster.yaml
          cluster_name: overwatch-cluster

      - name: Deploy monitoring stack
        run: |
          kubectl apply -f k8s/namespace/
          sleep 5
          kubectl apply -f k8s/prometheus/
          kubectl apply -f k8s/alertmanager/
          kubectl apply -f k8s/grafana/
          kubectl apply -f k8s/node-exporter/
          kubectl apply -f k8s/kube-state-metrics/
          kubectl apply -f k8s/blackbox-exporter/

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=prometheus     -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=grafana        -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=alertmanager   -n monitoring --timeout=180s

      - name: Verify Prometheus
        run: |
          kubectl port-forward svc/prometheus 9090:9090 -n monitoring &
          sleep 5
          curl -f http://localhost:9090/-/ready

      - name: Verify Grafana
        run: |
          kubectl port-forward svc/grafana 3000:3000 -n monitoring &
          sleep 5
          curl -f http://localhost:3000/api/health

      - name: Print pod status
        if: always()
        run: kubectl get pods -n monitoring -o wide

  # ─── Job 3: Deploy to Production ───────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            cd /opt/overwatch
            git pull origin main
            kubectl apply -f k8s/namespace/
            kubectl apply -f k8s/prometheus/
            kubectl apply -f k8s/alertmanager/
            kubectl apply -f k8s/grafana/
            kubectl apply -f k8s/node-exporter/
            kubectl apply -f k8s/kube-state-metrics/
            kubectl apply -f k8s/blackbox-exporter/
            kubectl get pods -n monitoring
